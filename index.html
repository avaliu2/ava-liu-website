<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ava Liu | Biomanufacturing Portfolio</title>
    <meta
      name="description"
      content="Ava Liu's biomanufacturing portfolio: cGMP operations, project execution, training systems, and quality documentation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=contact-cleanup" />
    <script src="./script.js?v=contact-cleanup" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <main class="lab-world" id="labWorld" data-section="intro" data-state="idle">
        <section class="intro-scene" aria-label="Lab bench">
          <div class="intro-lights" aria-hidden="true"></div>
          <div class="lab-wall" aria-hidden="true"></div>
          <div class="desk-surface" aria-hidden="true"></div>
          <div class="desk-glow" aria-hidden="true"></div>

          <div class="intro-copy" id="introCopy">
            <strong>Ava Liu</strong>
            <p>Biomedical Specialist</p>
          </div>

          <div class="bio-field bio-field-intro" aria-hidden="true">
            <span class="microbe microbe-a"></span>
            <span class="microbe microbe-b"></span>
            <span class="microbe microbe-c"></span>
            <span class="microbe microbe-d"></span>
            <span class="microbe microbe-e"></span>
            <span class="microbe microbe-f"></span>
            <span class="microbe microbe-g"></span>
            <span class="microbe microbe-h"></span>
            <span class="microbe microbe-i"></span>
            <span class="microbe microbe-j"></span>
          </div>

          <div class="microscope-scene" id="microscopeScene" aria-hidden="true">
            <svg class="microscope-svg" viewBox="0 0 1400 920" role="img" aria-hidden="true">
              <defs>
                <linearGradient id="metal" x1="0" x2="1">
                  <stop offset="0%" stop-color="#f3f5f2" />
                  <stop offset="45%" stop-color="#d7ddd6" />
                  <stop offset="100%" stop-color="#c4cbc5" />
                </linearGradient>
                <linearGradient id="metalDark" x1="0" x2="1">
                  <stop offset="0%" stop-color="#596261" />
                  <stop offset="100%" stop-color="#2e3333" />
                </linearGradient>
                <linearGradient id="glassWarm" x1="0" x2="1">
                  <stop offset="0%" stop-color="#f8fbf7" />
                  <stop offset="100%" stop-color="#d9dfd7" />
                </linearGradient>
                <linearGradient id="oliveLiquid" x1="0" x2="1">
                  <stop offset="0%" stop-color="#a4b896" />
                  <stop offset="100%" stop-color="#6d875f" />
                </linearGradient>
                <linearGradient id="amberLiquid" x1="0" x2="1">
                  <stop offset="0%" stop-color="#e7bb83" />
                  <stop offset="100%" stop-color="#c9904f" />
                </linearGradient>
                <radialGradient id="eyepieceBody" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#434949" />
                  <stop offset="55%" stop-color="#090b0b" />
                  <stop offset="100%" stop-color="#000000" />
                </radialGradient>
                <radialGradient id="lensGlass" cx="40%" cy="32%" r="70%">
                  <stop offset="0%" stop-color="#202626" />
                  <stop offset="55%" stop-color="#060707" />
                  <stop offset="100%" stop-color="#000000" />
                </radialGradient>
                <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="10" />
                </filter>
                <filter id="bodyBlur" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2.5" />
                </filter>
              </defs>

              <ellipse cx="700" cy="796" rx="370" ry="76" fill="rgba(40, 44, 43, 0.18)" filter="url(#softBlur)" />

              <g class="desk-equipment desk-equipment-left" filter="url(#bodyBlur)" opacity="0.98">
                <ellipse cx="292" cy="735" rx="120" ry="24" fill="rgba(72, 70, 55, 0.08)" />
                <rect x="236" y="652" rx="12" ry="12" width="132" height="24" fill="#bcc3b9" />
                <rect x="252" y="584" rx="12" ry="12" width="24" height="84" fill="url(#glassWarm)" />
                <rect x="290" y="572" rx="12" ry="12" width="24" height="96" fill="url(#glassWarm)" />
                <rect x="328" y="596" rx="12" ry="12" width="24" height="72" fill="url(#glassWarm)" />
                <rect x="252" y="620" rx="8" ry="8" width="24" height="48" fill="url(#oliveLiquid)" />
                <rect x="290" y="612" rx="8" ry="8" width="24" height="56" fill="url(#amberLiquid)" />
                <rect x="328" y="630" rx="8" ry="8" width="24" height="38" fill="url(#oliveLiquid)" />
                <ellipse cx="186" cy="724" rx="54" ry="20" fill="#eef2ec" />
                <ellipse cx="186" cy="724" rx="32" ry="12" fill="#ccd4ca" />
              </g>

              <g class="microscope-illustration">
                <g class="microscope-depth" filter="url(#bodyBlur)" opacity="0.98">
                  <path d="M701 214 C793 232 858 309 858 396 L858 465 C858 516 831 555 785 586 L724 628 L664 570 L727 524 C753 505 770 472 770 432 L770 310 C770 271 742 240 701 229 Z" fill="url(#metal)" stroke="#a3aba4" stroke-width="2" />
                  <path d="M699 212 C640 224 596 269 596 329 L596 596" fill="none" stroke="#d3d9d2" stroke-width="74" stroke-linecap="round" />
                  <path d="M699 212 C640 224 596 269 596 329 L596 596" fill="none" stroke="#9ba39c" stroke-width="2" stroke-linecap="round" />

                  <circle cx="915" cy="432" r="74" fill="url(#metal)" stroke="#a5ada6" stroke-width="2" />
                  <circle cx="915" cy="432" r="42" fill="#eef2ec" stroke="#b2bbb4" stroke-width="2" />
                  <circle cx="470" cy="502" r="46" fill="url(#metal)" stroke="#a5ada6" stroke-width="2" />

                  <circle cx="701" cy="430" r="64" fill="url(#metalDark)" />
                  <circle cx="701" cy="430" r="32" fill="#141717" />
                  <rect x="691" y="448" width="20" height="72" fill="url(#metalDark)" />

                  <rect x="542" y="512" rx="18" ry="18" width="318" height="92" fill="#1f2526" />
                  <rect x="620" y="470" rx="12" ry="12" width="162" height="48" fill="url(#metalDark)" />
                  <rect x="656" y="520" rx="8" ry="8" width="92" height="18" fill="#89988c" opacity="0.38" />

                  <path d="M530 650 C534 744 562 786 632 822 L790 822 C868 790 888 736 894 650 Z" fill="url(#metal)" stroke="#a3aba4" stroke-width="2" />
                  <ellipse cx="712" cy="664" rx="82" ry="36" fill="#eef2ec" />
                  <ellipse cx="712" cy="664" rx="38" ry="16" fill="#c5cdc4" />
                  <ellipse cx="712" cy="720" rx="110" ry="22" fill="rgba(255, 255, 255, 0.12)" />
                </g>

                <g class="eyepiece-bridge">
                  <path d="M612 124 H788 C823 124 850 151 850 184 L850 212 H550 V184 C550 151 577 124 612 124 Z" fill="url(#metal)" stroke="#a4aca5" stroke-width="2" />
                  <path d="M650 216 H750 C778 216 801 238 806 268 L594 268 C599 238 622 216 650 216 Z" fill="url(#metal)" stroke="#a4aca5" stroke-width="2" />

                  <g class="eyepiece-left">
                    <circle cx="600" cy="176" r="102" fill="url(#eyepieceBody)" />
                    <circle cx="600" cy="176" r="84" fill="#111515" stroke="#262b2b" stroke-width="8" />
                    <circle cx="600" cy="176" r="64" fill="url(#lensGlass)" />
                    <circle cx="600" cy="176" r="24" fill="#020303" />
                    <circle cx="600" cy="176" r="9" fill="#ffffff" opacity="0.78" />
                    <path d="M548 134 C568 114 603 109 639 122" fill="none" stroke="#e8ece8" stroke-width="7" opacity="0.28" stroke-linecap="round" />
                  </g>

                  <g class="eyepiece-right">
                    <circle cx="800" cy="176" r="102" fill="url(#eyepieceBody)" />
                    <circle cx="800" cy="176" r="84" fill="#111515" stroke="#262b2b" stroke-width="8" />
                    <circle cx="800" cy="176" r="64" fill="url(#lensGlass)" />
                    <circle cx="800" cy="176" r="24" fill="#020303" />
                    <circle cx="800" cy="176" r="9" fill="#ffffff" opacity="0.78" />
                    <path d="M748 134 C768 114 803 109 839 122" fill="none" stroke="#e8ece8" stroke-width="7" opacity="0.28" stroke-linecap="round" />
                  </g>

                  <path d="M650 120 L672 84 H732 L754 120 Z" fill="#737b79" />
                  <ellipse cx="700" cy="234" rx="92" ry="20" fill="rgba(71, 77, 76, 0.18)" />
                </g>
              </g>

              <g class="desk-equipment desk-equipment-right" filter="url(#bodyBlur)" opacity="0.98">
                <ellipse cx="1116" cy="735" rx="126" ry="24" fill="rgba(72, 70, 55, 0.08)" />
                <path d="M1032 714 L1062 634 H1114 L1144 714 Z" fill="#eef2ec" stroke="#b2bbb4" stroke-width="2" />
                <path d="M1047 714 L1069 664 H1107 L1129 714 Z" fill="url(#oliveLiquid)" opacity="0.9" />
                <rect x="1164" y="606" rx="18" ry="18" width="78" height="112" fill="#eef2ec" stroke="#b2bbb4" stroke-width="2" />
                <rect x="1178" y="646" rx="10" ry="10" width="50" height="58" fill="url(#amberLiquid)" />
                <rect x="1014" y="652" rx="12" ry="12" width="92" height="26" fill="#d9ddd6" />
                <path d="M1016 650 L950 622" stroke="#d9ddd6" stroke-width="12" stroke-linecap="round" />
                <path d="M950 622 L934 630" stroke="#bcc3b9" stroke-width="12" stroke-linecap="round" />
              </g>
            </svg>
          </div>

          <div class="start-overlay" id="startOverlay">
            <button type="button" class="launch-button" id="launchButton">Take a look</button>
          </div>
        </section>

        <section class="content-stage" id="contentStage" inert aria-hidden="true">
          <div class="bio-lane bio-lane-left" aria-hidden="true">
            <span class="microbe-side microbe-side-1"></span>
            <span class="microbe-side microbe-side-2"></span>
            <span class="microbe-side microbe-side-3"></span>
            <span class="microbe-side microbe-side-7"></span>
            <span class="microbe-side microbe-side-8"></span>
            <span class="microbe-side microbe-side-11"></span>
            <span class="microbe-side microbe-side-12"></span>
          </div>
          <div class="bio-lane bio-lane-right" aria-hidden="true">
            <span class="microbe-side microbe-side-4"></span>
            <span class="microbe-side microbe-side-5"></span>
            <span class="microbe-side microbe-side-6"></span>
            <span class="microbe-side microbe-side-9"></span>
            <span class="microbe-side microbe-side-10"></span>
            <span class="microbe-side microbe-side-13"></span>
            <span class="microbe-side microbe-side-14"></span>
          </div>

          <div class="content-grid">
            <nav class="centrifuge-stage" aria-labelledby="navigationHeading">
              <h2 class="navigation-title" id="navigationHeading">Navigation</h2>
              <div class="centrifuge-machine">
                <div class="centrifuge-pointer" aria-hidden="true"></div>
                <div class="rotor-shell">
                  <div class="rotor" id="rotor"></div>
                  <div class="rotor-core" aria-hidden="true"></div>
                </div>
              </div>
              <button type="button" class="motion-toggle" id="motionToggle">Pause motion</button>
            </nav>

            <section class="section-frame">
              <header class="section-header">
                <h1 id="sectionTitle" tabindex="-1"></h1>
              </header>

              <div class="section-layout">
                <section class="section-main" id="mainContent"></section>
                <aside class="section-side" id="sideContent"></aside>
              </div>
            </section>

            <aside class="ambient-column" aria-hidden="true">
              <div class="ambient-orb ambient-orb-top"></div>
              <div class="ambient-petri"></div>
              <div class="ambient-rack">
                <span class="ambient-rack-base"></span>
                <span class="ambient-rack-tube ambient-rack-tube-a"></span>
                <span class="ambient-rack-tube ambient-rack-tube-b"></span>
                <span class="ambient-rack-tube ambient-rack-tube-c"></span>
              </div>
              <div class="ambient-pipette"></div>
              <div class="ambient-flask"></div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="no-script">
        This portfolio uses a small amount of JavaScript for the microscope entry and centrifuge navigation.
      </div>
    </noscript>
  </body>
</html>
